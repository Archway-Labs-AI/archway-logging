[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archway-logging"
version = "1.0.0"
description = "Archway's logging contract and the library every service uses to keep it"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/archway_logging"]

[tool.hatch.build.targets.wheel.force-include]
"schema/log-line.v1.json" = "archway_logging/schema/log-line.v1.json"

[tool.hatch.envs.default]
python = "3.14"
python-sources = ["external"]
dependencies = ["pytest>=8"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
